<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boston'a Dershane Açıyoruz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <!-- Headline lockup + manifesto -->
    <header class="hero">
      <div class="hero-lockup">
        <span class="hero-boston">Boston'a</span>
        <span class="hero-dershane">dershane</span>
        <span class="hero-aciyoruz">açıyoruz</span>
      </div>
      <section class="manifesto" aria-label="Manifesto">
        <p>Boston'da cemaat var.</p>
        <p>Mülk dershane yok.</p>
        <p>Bunu birlikte değiştirelim.</p>
      </section>
    </header>

    <!-- Phase 3 & 4: Raised amount + CTA (same row) -->
    <section class="bottom-row">
      <div class="raised-amount">
        <div class="raised-col">
          <span class="raised-label">HEDEF</span>
          <span class="raised-value">$855,000</span>
        </div>
        <div class="raised-col">
          <span class="raised-label">ŞU ANA KADAR</span>
          <span class="raised-value">$76,000</span>
        </div>
      </div>
      <div class="cta">
        <p class="cta-text">Zekât / Sadaka ile katkı verin</p>
        <div class="cta-row">
          <img
            class="cta-qr"
            src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https%3A%2F%2Fboston.lh4h.org"
            alt="QR kodu: boston.lh4h.org"
            width="120"
            height="120"
          >
          <a class="cta-url" href="https://boston.lh4h.org">boston.lh4h.org</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
